# Составлена вручную для проверки фильтра по материалу
title: Вал гладкий алюминиевый (Sinumerik)
machine: Токарный станок с ЧПУ Sinumerik 802D
material: aluminium
header: |
  ; VAL GLADKIY AL
  G54 G40 G71 G90 G95
operations:
  - type: facing
    description: >-
      Подрезка торца алюминиевой заготовки диаметром 52 мм проходным резцом T1,
      скорость резания 250 м/мин, подача 0.2 мм/об
    code: |
      T1 D1
      G96 S250 M3
      LIMS=2500
      G0 X52 Z0 M8
      G1 X-1 F0.2
      G0 Z2
  - type: turning
    description: >-
      Наружное продольное точение гладкого вала простыми проходами без цикла: с диаметра 50
      до 46 мм на длине 40 мм, чистовой резец T2, скорость резания 250 м/мин, подача 0.2 мм/об
    code: |
      T2 D1
      G96 S250 M3
      LIMS=2500
      G0 X48 Z2 M8
      G1 Z-40 F0.2
      G1 X52
      G0 Z2
      G0 X46
      G1 Z-40
      G1 X52
      G0 X200 Z200
footer: |
  M9
  M5
  M30
