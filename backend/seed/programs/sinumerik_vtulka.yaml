# По лабораторному примеру KONTURNOE.MPF из проекта AnyCNC, с упрощениями
title: Втулка с наружным контуром (Sinumerik)
machine: Токарный станок с ЧПУ Sinumerik 802D
material: steel
header: |
  ; VTULKA S KONTUROM
  G54 G40 G71 G90 G95
operations:
  - type: facing
    description: >-
      Подрезка торца заготовки диаметром 76 мм в размер Z0 проходным резцом T1,
      постоянная скорость резания 110 м/мин, подача 0.15 мм/об
    code: |
      T1 D1
      G96 S110 M3
      LIMS=1300
      G0 X76 Z0 M8
      G1 X-2 F0.15
      G0 Z2
  - type: turning
    description: >-
      Черновое наружное точение контура втулки циклом CYCLE95 по подпрограмме контура CONTUR,
      глубина резания 2 мм, припуск 0.5 мм, подача 0.15 мм/об, резец T1
    code: |
      T1 D1
      G96 S110 M3
      LIMS=1300
      G0 X76 Z2 M8
      CYCLE95("CONTUR",2,0,0,0.5,0.15,0.1,,1,0.1,20,1,0,2)
      G0 X200 Z200
  - type: drilling
    description: >-
      Сверление центрального отверстия диаметром 20 мм на глубину 32 мм сверлом T5,
      цикл CYCLE82, частота вращения 400 об/мин
    code: |
      T5 D1
      G97 S400 M3
      G0 X0 Z2 M8
      CYCLE82(100,0,1,,-32,0.6,10,1,11)
      G0 X200 Z200
footer: |
  M9
  M5
  M30
