- name: Токарный станок с ЧПУ Fanuc 0i-TD
  kind: lathe
  dialect: fanuc_turn
  max_spindle_rpm: 3000
  notes: >-
    Инструмент вызывается в виде TNNKK: NN — позиция револьверной головки, KK — номер корректора
    (например, T0101). Ограничение оборотов задаётся кадром G50 S. Размеры по X — в диаметрах.
  tools:
    - {position: 1, name: Резец проходной черновой, type: проходной}
    - {position: 2, name: Резец проходной чистовой, type: проходной}
    - {position: 3, name: Резец канавочный 3 мм, type: канавочный}
    - {position: 4, name: Резец резьбовой 60°, type: резьбовой}
    - {position: 11, name: Сверло спиральное Ø20, type: сверло}

- name: Токарный станок с ЧПУ Sinumerik 802D
  kind: lathe
  dialect: sinumerik_turn
  max_spindle_rpm: 2500
  notes: >-
    Инструмент вызывается в виде T<позиция> D<кромка> (например, T1 D1). Ограничение оборотов
    задаётся присваиванием LIMS=. Контур для цикла CYCLE95 описывается отдельной подпрограммой.
  tools:
    - {position: 1, name: Резец проходной черновой, type: проходной}
    - {position: 2, name: Резец проходной чистовой, type: проходной}
    - {position: 3, name: Резец резьбовой 60°, type: резьбовой}
    - {position: 4, name: Сверло центровочное, type: сверло}
    - {position: 5, name: Сверло спиральное Ø20, type: сверло}
