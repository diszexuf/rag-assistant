title: Sinumerik, токарная обработка
syntax: sinumerik
tool_format: plain
comment_syntax: "после точки с запятой до конца строки, латиницей, например ; PODREZKA TORCA"
program_end: [M30, M2, M17, RET]
spindle:
  css_on: G96
  css_off: G97
  limit_word: LIMS

# Подсказки для модели: чем выполняется операция в этом диалекте
op_hints:
  facing: "проход G1 по X к оси на Z0 с рабочей подачей, затем отвод по Z"
  turning: 'простые ступени — проходами G1; сложный контур — CYCLE95("ИМЯ_КОНТУРА", MID глубина резания, FALZ, FALX, FAL припуск, FF1 черновая подача, FF2, FF3 чистовая подача, VARI вид обработки, DT, DAM, VRT), контур описывается отдельной подпрограммой'
  drilling: "цикл CYCLE83 одной строкой, значения через запятую без имён параметров: CYCLE83(<плоскость отвода>,<начало Z>,<безопасное расстояние>,<конечная глубина со знаком минус>,,<первая глубина со знаком минус>,,<остальные значения как в образце>). Перед циклом G97 S<об/мин> и подвод G0 X0 Z2"
  threading: "цикл CYCLE97 одной строкой, значения через запятую без имён параметров: CYCLE97(<шаг резьбы>,,<начало Z>,<конец Z>,<наружный диаметр>,<наружный диаметр>,<значения входа и выхода как в образце>,<глубина профиля>,<припуск>,<угол врезания>,<остальные значения как в образце>). Перед циклом G97 S<об/мин>"

commands:
  G0: Быстрое перемещение
  G1: Линейная интерполяция
  G2: Круговая интерполяция по часовой стрелке
  G3: Круговая интерполяция против часовой стрелки
  G4: Выдержка
  G17: Плоскость XY
  G18: Плоскость ZX
  G19: Плоскость YZ
  G33: Нарезание резьбы с постоянным шагом
  G40: Отмена коррекции на радиус вершины
  G41: Коррекция на радиус вершины слева
  G42: Коррекция на радиус вершины справа
  G53: Отмена смещения нуля покадрово
  G54: Смещение нуля 1
  G55: Смещение нуля 2
  G56: Смещение нуля 3
  G57: Смещение нуля 4
  G70: Размеры в дюймах
  G71: Размеры в миллиметрах
  G90: Абсолютные размеры
  G91: Размеры в приращениях
  G94: Подача в минуту
  G95: Подача на оборот
  G96: Постоянная скорость резания
  G97: Постоянная частота вращения
  G500: Отмена смещения нуля
  M0: Останов программы
  M1: Останов по выбору
  M2: Конец программы
  M3: Вращение шпинделя по часовой стрелке
  M4: Вращение шпинделя против часовой стрелки
  M5: Останов шпинделя
  M6: Смена инструмента
  M8: Включение охлаждения
  M9: Выключение охлаждения
  M17: Конец подпрограммы
  M30: Конец программы
  RET: Конец подпрограммы
  DIAMON: Программирование диаметра включено
  DIAMOF: Программирование радиуса
  DIAM90: Диаметр для G90, радиус для G91
  TRANS: Программируемое смещение нуля
  ATRANS: Аддитивное смещение нуля
  MCALL: Модальный вызов цикла
  MSG: Сообщение оператору
  WORKPIECE: Описание заготовки
  CYCLE81: Сверление, центрование
  CYCLE82: Сверление, зенкование
  CYCLE83: Глубокое сверление
  CYCLE84: Нарезание резьбы метчиком
  CYCLE93: Цикл канавок
  CYCLE94: Цикл выточки
  CYCLE95: Цикл снятия припуска по контуру
  CYCLE97: Цикл нарезания резьбы
  CYCLE930: Цикл канавок
