title: Fanuc, токарная обработка
syntax: fanuc
tool_format: fanuc_tt
comment_syntax: "только в круглых скобках и только латиницей, например (PODREZKA TORCA); точка с запятой недопустима"
program_end: [M30, M2, M99]
spindle:
  css_on: G96
  css_off: G97
  limit_command: G50

# Подсказки для модели: чем выполняется операция в этом диалекте
op_hints:
  facing: "проход G1 по X к оси на Z0 с рабочей подачей, затем отвод по Z"
  turning: "черновое точение по контуру: G71 U(глубина резания) R(отвод); G71 P(первый кадр контура) Q(последний кадр) U(припуск по X) W(припуск по Z) F(подача). Кадры контура идут сразу после и помечаются номерами N из P и Q"
  drilling: "цикл G83, отмена G80. Пример для глубины 25 мм: G83 X0 Z-25 Q5000 R2 F0.1 (Q — шаг сверления в микронах, R — плоскость отвода). Перед циклом G97 и подвод G0 X0 Z2"
  threading: "цикл G76 двумя кадрами. Пример для резьбы М30х1.5 длиной 20 мм: G76 P020060 Q100 R0.05 и следом G76 X28.16 Z-20 P920 Q300 F1.5 (X — внутренний диаметр резьбы, P — высота профиля в микронах, F — шаг). Перед циклом G97"

commands:
  G0: Быстрое перемещение
  G1: Линейная интерполяция
  G2: Круговая интерполяция по часовой стрелке
  G3: Круговая интерполяция против часовой стрелки
  G4: Выдержка
  G18: Плоскость ZX
  G20: Размеры в дюймах
  G21: Размеры в миллиметрах
  G28: Возврат в референтную позицию
  G30: Возврат во вторую референтную позицию
  G32: Нарезание резьбы за один проход
  G40: Отмена коррекции на радиус вершины
  G41: Коррекция на радиус вершины слева
  G42: Коррекция на радиус вершины справа
  G50: Ограничение оборотов шпинделя / установка системы координат
  G54: Система координат детали 1
  G55: Система координат детали 2
  G56: Система координат детали 3
  G57: Система координат детали 4
  G58: Система координат детали 5
  G59: Система координат детали 6
  G65: Вызов макропрограммы
  G70: Цикл чистовой обработки
  G71: Цикл черновой продольной обработки
  G72: Цикл черновой поперечной обработки
  G73: Цикл обработки по контуру
  G74: Цикл торцевого сверления / канавок
  G75: Цикл наружных канавок
  G76: Цикл многопроходного нарезания резьбы
  G80: Отмена постоянного цикла
  G83: Цикл глубокого сверления
  G84: Цикл нарезания резьбы метчиком
  G90: Цикл продольного точения
  G92: Цикл нарезания резьбы
  G94: Цикл торцевого точения
  G96: Постоянная скорость резания
  G97: Постоянная частота вращения
  G98: Подача в минуту
  G99: Подача на оборот
  M0: Останов программы
  M1: Останов по выбору
  M2: Конец программы
  M3: Вращение шпинделя по часовой стрелке
  M4: Вращение шпинделя против часовой стрелки
  M5: Останов шпинделя
  M6: Смена инструмента
  M8: Включение охлаждения
  M9: Выключение охлаждения
  M30: Конец программы с возвратом в начало
  M98: Вызов подпрограммы
  M99: Конец подпрограммы
