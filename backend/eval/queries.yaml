# Запросы для оценки поиска (python -m eval.run_search).
# expected — заголовок программы (или список допустимых), операция которой должна найтись;
# null — подходящей операции в базе нет, правильный ответ «источника нет».
# Поиск идёт с фильтром по типу станка, типу операции и диалекту станка запроса.

# --- Fanuc ---
- id: facing-fanuc-close
  machine: Токарный станок с ЧПУ Fanuc 0i-TD
  op_type: facing
  description: Подрезка торца заготовки диаметром 84 мм в размер Z0 проходным резцом T0101, постоянная скорость резания 130 м/мин, подача 0.15 мм/об
  expected: [Вал ступенчатый с резьбой (Fanuc), Втулка с центральным отверстием (Fanuc)]

- id: facing-fanuc-para
  machine: Токарный станок с ЧПУ Fanuc 0i-TD
  op_type: facing
  description: Торцевание заготовки Ø60, резец T0101, подача 0.15, скорость 120 м/мин
  expected: [Вал ступенчатый с резьбой (Fanuc), Втулка с центральным отверстием (Fanuc)]

- id: facing-fanuc-aluminium
  machine: Токарный станок с ЧПУ Fanuc 0i-TD
  op_type: facing
  description: Подрезка торца алюминиевой заготовки диаметром 50 мм резцом T0101, скорость резания 250 м/мин
  expected: [Вал ступенчатый с резьбой (Fanuc), Втулка с центральным отверстием (Fanuc)]

- id: turning-fanuc-close
  machine: Токарный станок с ЧПУ Fanuc 0i-TD
  op_type: turning
  description: Черновое продольное точение наружного контура ступенчатого вала циклом G71, глубина резания 2 мм, припуск 0.5 мм, подача 0.15 мм/об, резец T0101
  expected: Вал ступенчатый с резьбой (Fanuc)

- id: turning-fanuc-para
  machine: Токарный станок с ЧПУ Fanuc 0i-TD
  op_type: turning
  description: Проточить вал по ступеням, черновой проход, глубина за проход 2 мм, снять с диаметра 82
  expected: Вал ступенчатый с резьбой (Fanuc)

- id: threading-fanuc-close
  machine: Токарный станок с ЧПУ Fanuc 0i-TD
  op_type: threading
  description: Нарезание наружной метрической резьбы М45х1.5 длиной 26 мм резьбовым резцом T0404, многопроходный цикл G76, частота вращения 750 об/мин
  expected: Вал ступенчатый с резьбой (Fanuc)

- id: threading-fanuc-para
  machine: Токарный станок с ЧПУ Fanuc 0i-TD
  op_type: threading
  description: Нарезать метрическую резьбу М30 с шагом 1.5 на валу, резьбовой резец, 700 оборотов
  expected: Вал ступенчатый с резьбой (Fanuc)

- id: drilling-fanuc-close
  machine: Токарный станок с ЧПУ Fanuc 0i-TD
  op_type: drilling
  description: Сверление центрального отверстия диаметром 20 мм на глубину 42 мм сверлом T1111, цикл глубокого сверления G83, 600 об/мин
  expected: Втулка с центральным отверстием (Fanuc)

- id: drilling-fanuc-para
  machine: Токарный станок с ЧПУ Fanuc 0i-TD
  op_type: drilling
  description: Просверлить сквозное отверстие Ø20 в заготовке втулки, сверло в позиции 11, с периодическим выводом сверла
  expected: Втулка с центральным отверстием (Fanuc)

