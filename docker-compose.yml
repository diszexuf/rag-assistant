services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Эмбеддинги BAAI/bge-m3 (1024 измерения). Модель (~2.3 ГБ) скачивается при первом запуске
  # в том hf_cache. Бэкенд обращается к сервису, только если EMBEDDING_PROVIDER=tei.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    # max-batch-tokens по умолчанию 16384: ONNX Runtime при прогреве занимает ~11 ГБ памяти.
    # Тексты у нас короткие, поэтому лимит снижен.
    command: --model-id BAAI/bge-m3 --max-batch-tokens 2048
    ports:
      - "8081:80"
    volumes:
      - hf_cache:/data

  # Реранкер BAAI/bge-reranker-v2-m3 (~2.3 ГБ). Нужен, только если RERANKER_PROVIDER=tei.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: --model-id BAAI/bge-reranker-v2-m3 --max-batch-tokens 4096
    ports:
      - "8082:80"
    volumes:
      - hf_cache:/data

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  hf_cache:
